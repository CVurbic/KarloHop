[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify build image has Chromium installed — tell puppeteer to use it
  PUPPETEER_EXECUTABLE_PATH = "/usr/bin/chromium-browser"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

# Dynamic sitemap via Netlify Function (queries blog posts from Supabase)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Serve pre-rendered HTML files first, then fallback to SPA
[[redirects]]
  from = "/jednorog-napuhanac"
  to = "/jednorog-napuhanac/index.html"
  status = 200

[[redirects]]
  from = "/minecraft-napuhanac"
  to = "/minecraft-napuhanac/index.html"
  status = 200

[[redirects]]
  from = "/dinosaur-napuhanac"
  to = "/dinosaur-napuhanac/index.html"
  status = 200

[[redirects]]
  from = "/paw-patrol-napuhanac"
  to = "/paw-patrol-napuhanac/index.html"
  status = 200

# Blog and admin routes — SPA fallback
[[redirects]]
  from = "/savjeti/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/hop-upravljanje/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
